[project]
name = "squadco-mcp"
version = "0.1.1"
description = "SquadCo API documentation as an MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.2.0",
    "citekit>=0.1.0",
]

[project.scripts]
squadco-mcp = "squadco_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/squadco_mcp"]
include = [
    "src/squadco_mcp/.resource_maps/*.json",
    "src/squadco_mcp/docs/*.md"
]
