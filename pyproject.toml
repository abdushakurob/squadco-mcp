[project]
name = "squadco-mcp"
version = "0.1.5"
description = "SquadCo API documentation as an MCP server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=0.1.0",
    "citekit>=0.1.0",
]

[project.scripts]
squadco-mcp = "squadco_mcp.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["squadco_mcp"]
include-package-data = true

[tool.setuptools.package-data]
"squadco_mcp" = [".resource_maps/*.json", "docs/*.md"]
